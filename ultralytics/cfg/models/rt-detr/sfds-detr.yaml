# SFDS-DETR: Spatial-Frequency Directional Synergy for Small Object Detection
# Paper-aligned architecture naming; loss functions remain native Ultralytics.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

# Frequency-Aware Feature Extraction Backbone (FAFEB)
# Spatial features: S1-S5; wavelet features: F1-F4; enhanced features: SF1-SF4.
backbone:
  - [-1, 1, nn.Identity, []]                       # 0: input

  # Cascaded wavelet branch: F1-F4
  - [0, 1, WaveletTransform, []]                   # 1: F1, 1/2 resolution
  - [-1, 1, CascadedWaveletTransform, []]          # 2: F2, 1/4 resolution
  - [-1, 1, CascadedWaveletTransform, []]          # 3: F3, 1/8 resolution
  - [-1, 1, CascadedWaveletTransform, []]          # 4: F4, 1/16 resolution

  # Stage 1: spatial feature S1 + frequency feature F1 -> SF1
  - [0, 1, Conv, [64, 3, 2]]                       # 5: S1
  - [[1, 5], 1, CAAE, [64]]                        # 6: SF1

  # Stage 2: SF1 -> S2; CAAE(S2, F2) -> SF2
  - [-1, 1, Conv, [128, 3, 2]]                     # 7: downsample
  - [-1, 1, ConvBlock, [128]]                      # 8: S2
  - [[2, 8], 1, CAAE, [128]]                       # 9: SF2 (P2/4)

  # Stage 3: SF2 -> S3; CAAE(S3, F3) -> SF3
  - [-1, 1, Conv, [256, 3, 2]]                     # 10: downsample
  - [-1, 1, ConvBlock, [256]]                      # 11: S3
  - [[3, 11], 1, CAAE, [256]]                      # 12: SF3 (P3/8)

  # Stage 4: SF3 -> S4; CAAE(S4, F4) -> SF4
  - [-1, 1, Conv, [384, 3, 2]]                     # 13: downsample
  - [-1, 1, ConvBlock, [384]]                      # 14: S4
  - [[4, 14], 1, CAAE, [384]]                      # 15: SF4 (P4/16)

  # Stage 5: spatial-only deep semantic extraction
  - [-1, 1, Conv, [384, 3, 2]]                     # 16: downsample
  - [-1, 3, ConvBlock, [384]]                      # 17: S5 (P5/32)

# Orientation-Sensitive Pyramid Fusion Encoder (OSPFE) + native RT-DETR decoder/head
head:
  - [-1, 1, Conv, [256, 1, 1, null, 1, 1, false]] # 18: project S5
  - [-1, 1, AIFI, [1024, 8]]                       # 19: intra-scale interaction
  - [-1, 1, Conv, [256, 1, 1]]                     # 20: Y5

  # Top-down path: P5 -> P4
  - [-1, 1, nn.Upsample, [null, 2, nearest]]        # 21
  - [15, 1, Conv, [256, 1, 1, null, 1, 1, false]] # 22: project SF4
  - [[-2, -1], 1, Concat, [1]]                     # 23
  - [-1, 3, OSRF, [256, 0.5]]                      # 24
  - [-1, 1, Conv, [256, 1, 1]]                     # 25: Y4

  # Top-down path: P4 -> P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]]        # 26
  - [12, 1, Conv, [256, 1, 1, null, 1, 1, false]] # 27: project SF3
  - [[-2, -1], 1, Concat, [1]]                     # 28
  - [-1, 3, OSRF, [256, 0.5]]                      # 29: X3

  # Auxiliary shallow scale: P3 -> P2
  - [-1, 1, nn.Upsample, [null, 2, nearest]]        # 30
  - [9, 1, Conv, [256, 1, 1, null, 1, 1, false]]  # 31: project SF2
  - [[-2, -1], 1, Concat, [1]]                     # 32
  - [-1, 3, OSRF, [128, 0.5]]                      # 33: P2 output

  # Bottom-up path: P2 -> P3
  - [-1, 1, Conv, [256, 3, 2]]                     # 34
  - [[-1, 29], 1, Concat, [1]]                     # 35
  - [-1, 3, OSRF, [128, 0.5]]                      # 36: P3 output

  # Bottom-up path: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                     # 37
  - [[-1, 25], 1, Concat, [1]]                     # 38
  - [-1, 3, OSRF, [128, 0.5]]                      # 39: P4 output

  # Bottom-up path: P4 -> P5
  - [-1, 1, Conv, [256, 3, 2]]                     # 40
  - [[-1, 20], 1, Concat, [1]]                     # 41
  - [-1, 3, OSRF, [128, 0.5]]                      # 42: P5 output

  - [[33, 36, 39, 42], 1, RTDETRDecoder, [nc, 128, 300, 4, 8, 3]] # 43
